name = "padloc-worker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# account_id intentionally omitted -- resolved via `wrangler login` or the
# CLOUDFLARE_ACCOUNT_ID env var so no account is hardcoded in a committed file.
# Real (non-local) deploy environments live in wrangler.local.toml, which is
# git-ignored -- see wrangler.local.toml.example for the template.

[alias]
"@padloc/locale/src/translate" = "./node_modules/@padloc/locale/src/translate.ts"
"@padloc/core/src" = "./node_modules/@padloc/core/src"
"@padloc/locale/src" = "./node_modules/@padloc/locale/src"

[[migrations]]
tag = "v1"
new_classes = ["AccountLockDO"]

# Top-level D1 migration config (used for local dev). --local mode never
# contacts a real Cloudflare account, so these IDs are placeholders.
[[d1_databases]]
binding = "DB"
database_name = "padloc-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.dev]
name = "padloc-worker-dev"

[env.dev.vars]
EMAIL_VERIFY_ON_SIGNUP = "false"
EMAIL_BACKEND = "mock"
ALLOW_ORIGIN = "*"
CLIENT_URL = "http://localhost:3000"
HQ_ENVIRONMENT = "development"
HQ_SERVICE_NAME = "padloc-worker"

[[env.dev.kv_namespaces]]
binding = "EMAIL_KV"
id = "PADLOC_EMAIL_DEV"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "padloc-dev"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-dev"

[[env.dev.kv_namespaces]]
binding = "HINTS"
id = "PADLOC_HINTS_DEV"

[[env.dev.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"

[env.preview]
name = "padloc-worker-preview"

[env.preview.vars]
EMAIL_BACKEND = "mock"
ALLOW_ORIGIN = "*"
CLIENT_URL = "http://localhost:3000"
HQ_ENVIRONMENT = "preview"
HQ_SERVICE_NAME = "padloc-worker"

[[env.preview.kv_namespaces]]
binding = "EMAIL_KV"
id = "00000000000000000000000000000001"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "padloc-preview"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "padloc-attachments-preview"

[[env.preview.kv_namespaces]]
binding = "HINTS"
id = "00000000000000000000000000000002"

[[env.preview.durable_objects.bindings]]
name = "ACCOUNT_LOCK"
class_name = "AccountLockDO"

