name: Docker Publish (GHCR)

# Builds the two self-hosted Padloc images (server + pwa) and pushes them to
# the GitHub Container Registry (ghcr.io). Zero manual secrets: the built-in
# GITHUB_TOKEN authenticates, granted push access via `permissions:
# packages: write` below.
#
# Images are published as:
#   ghcr.io/<owner>/padloc-server:latest / :<short-sha> / :<tag>
#   ghcr.io/<owner>/padloc-pwa:latest    / :<short-sha> / :<tag>
#
# GHCR packages default to PRIVATE. Either make them public (package
# Settings -> Change visibility on ghcr.io) or `docker login ghcr.io` with a
# PAT (read:packages) on any host that needs to `docker compose pull` them.

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/docker-publish.yml"
            - "Dockerfile-pwa"
            - "Dockerfile-server"
            - "package.json"
            - "package-lock.json"
            - "packages/*/package.json"
            - "packages/*/package-lock.json"
            - "packages/pwa/**"
            - "packages/server/**"
            - "packages/app/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "assets/**"
    workflow_dispatch:
        inputs:
            tag:
                description: "Extra tag to publish (e.g. v1.2.3)"
                required: false
                default: ""

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        name: Build and push (${{ matrix.name }})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - name: server
                      dockerfile: Dockerfile-server
                    - name: pwa
                      dockerfile: Dockerfile-pwa
        steps:
            - name: Check out the repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Compute lowercase owner
              id: owner
              run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags/labels)
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                  images: ghcr.io/${{ steps.owner.outputs.lc }}/padloc-${{ matrix.name }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short
                      type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

            - name: Build and push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.name }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.name }}
